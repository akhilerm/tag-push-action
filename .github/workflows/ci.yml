name: Tests

on:
  push:
  schedule:
    # Real registry (docker.io <-> quay.io) token-based copy.
    - cron: '30 3 * * *'

jobs:
  tag-push:
    name: Test Copy Operation
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      REGISTRY_USER: testuser
      REGISTRY_PASSWORD: testpassword
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start authenticated registry
        run: |
          mkdir -p "$RUNNER_TEMP/auth"
          docker run --rm --entrypoint htpasswd httpd:2 \
            -Bbn "$REGISTRY_USER" "$REGISTRY_PASSWORD" > "$RUNNER_TEMP/auth/htpasswd"
          docker run -d --restart=always \
            --name registry \
            -p 5001:5000 \
            -v "$RUNNER_TEMP/auth:/auth" \
            -e REGISTRY_AUTH=htpasswd \
            -e "REGISTRY_AUTH_HTPASSWD_REALM=Registry Realm" \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            docker.io/distribution/distribution:3
          # Wait until the registry answers (401 = up and asking for auth).
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5001/v2/" || true)
            [ "$code" != "000" ] && break
            sleep 1
          done

      - name: Login to registry
        run: |
          echo "$REGISTRY_PASSWORD" | \
            docker login localhost:5001 -u "$REGISTRY_USER" --password-stdin

      - name: Copy image to the registry
        uses: ./
        with:
          src: docker.io/library/busybox:latest
          dst: |
            localhost:5001/busybox:ci

      - name: Verify pushed image
        # The copied image must be byte-identical to the source, so their
        # (content-addressed) image IDs have to match.
        run: |
          docker pull busybox:latest
          docker pull localhost:5001/busybox:ci
          SRC_ID=$(docker images -q busybox:latest)
          DST_ID=$(docker images -q localhost:5001/busybox:ci)
          echo "pushed image: ${DST_ID} (expected ${SRC_ID})"
          test "$SRC_ID" = "$DST_ID"

  # Token-based copy between docker.io and quay.io. Runs only on the cron
  # schedule (needs the QUAY_*/DOCKERHUB_* secrets and will not run on forks).
  real-registries:
    name: Test docker.io <-> quay.io copy
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get image tag from commit hash
        run: |
          SHORT_HASH=$(git rev-parse --short "$GITHUB_SHA")
          echo "TAG=${SHORT_HASH}" >> $GITHUB_ENV

      - name: Login Dockerhub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login Quay
        uses: docker/login-action@v4.5.2
        with:
          registry: 'quay.io'
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # First direction: docker.io -> quay.io
      - name: Copy docker.io to quay.io
        uses: ./
        with:
          src: docker.io/openebs/linux-utils:ci
          dst: |
            quay.io/akhilerm/linux-utils:${{ env.TAG }}

      - name: Verify docker.io to quay.io
        # The copy must be byte-identical, so the registry manifest digests
        # have to match. (Local `docker images -q` IDs are unreliable for
        # multi-arch images, so compare the registry digests directly.)
        run: |
          SRC=$(docker buildx imagetools inspect docker.io/openebs/linux-utils:ci --format '{{.Manifest.Digest}}')
          DST=$(docker buildx imagetools inspect quay.io/akhilerm/linux-utils:${{ env.TAG }} --format '{{.Manifest.Digest}}')
          echo "pushed digest: ${DST} (expected ${SRC})"
          test "$SRC" = "$DST"

      # Second direction: quay.io -> docker.io
      - name: Copy quay.io to docker.io
        uses: ./
        with:
          src: quay.io/centos/centos:stream9-minimal
          dst: |
            docker.io/akhilerm/centos-test:stream9

      - name: Verify quay.io to docker.io
        # The copy must be byte-identical, so the registry manifest digests
        # have to match. (Local `docker images -q` IDs are unreliable for
        # multi-arch images, so compare the registry digests directly.)
        run: |
          SRC=$(docker buildx imagetools inspect quay.io/centos/centos:stream9-minimal --format '{{.Manifest.Digest}}')
          DST=$(docker buildx imagetools inspect docker.io/akhilerm/centos-test:stream9 --format '{{.Manifest.Digest}}')
          echo "pushed digest: ${DST} (expected ${SRC})"
          test "$SRC" = "$DST"

  test3:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        run: npm install

      - name: Test
        run: npm test
